# PUFFERFIN: client-side release. The ghcr.io/pufferfin/pufferfin image is
# built by the `release.yml` workflow of Pufferfin/Pufferfin, which embeds this
# built client. Here: check that main builds and tracks the same Jellyfin major
# version as the server, then request a new image.
# Pufferfin-only workflow: no Jellyfin workflow is modified.
# Contract: .github/pufferfin/README.md
name: Pufferfin / Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pufferfin-release
  cancel-in-progress: false

env:
  SERVER_REPO: Pufferfin/Pufferfin
  SERVER_REF: main

jobs:
  build:
    if: github.repository == 'Pufferfin/Pufferfin-web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Major-version guard
        run: |
          web="$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' package.json | head -n 1)"
          server="$(curl -fsSL --max-time 20 --retry 2 "https://raw.githubusercontent.com/${SERVER_REPO}/${SERVER_REF}/SharedVersion.cs" \
            | sed -n 's/.*AssemblyVersion("\([^"]*\)").*/\1/p' | head -n 1)"
          echo "Client on Jellyfin ${web}, server on Jellyfin ${server}"
          if [ -z "$server" ] || [ "${web%%.*}" != "${server%%.*}" ]; then
            echo "::error::Release blocked: client is on Jellyfin ${web}, server is on Jellyfin ${server:-unknown}. Both repositories must track the same major version."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build and test
        run: |
          npm ci --no-audit
          npm run build:production
          npm test

  request-image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the image build in Pufferfin/Pufferfin
        env:
          GH_TOKEN: ${{ secrets.PUFFERFIN_RELEASE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PUFFERFIN_RELEASE_DISPATCH_TOKEN not set: the image will be rebuilt on the next server release."
            exit 0
          fi
          gh api "repos/${SERVER_REPO}/dispatches" \
            -f event_type=pufferfin-web-updated \
            -f "client_payload[web_sha]=${GITHUB_SHA}"
