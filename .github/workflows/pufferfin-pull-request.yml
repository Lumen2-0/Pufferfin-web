# PUFFERFIN: CI for pull requests targeting main. Jellyfin's `pull_request.yml`
# only triggers on `master` and `release*`, so PRs to `main` had no checks at
# all. This file reuses the same Jellyfin building blocks (`__package.yml`,
# `__quality_checks.yml`, `__codeql.yml`) without modifying any of them.
# Pufferfin-only workflow: no Jellyfin workflow is modified.
# Contract: .github/pufferfin/README.md
name: Pufferfin / Pull Request

concurrency:
  group: pufferfin-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# No paths-ignore: every PR to main must report checks, documentation-only PRs
# included, so the merge gate never has to interpret an empty check list.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/__package.yml
    with:
      commit: ${{ github.event.pull_request.head.sha }}

  quality_checks:
    name: Quality checks
    uses: ./.github/workflows/__quality_checks.yml
    permissions:
      contents: read
    with:
      commit: ${{ github.event.pull_request.head.sha }}

  codeql:
    name: CodeQL
    uses: ./.github/workflows/__codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      commit: ${{ github.event.pull_request.head.sha }}
