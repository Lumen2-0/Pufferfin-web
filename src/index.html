<!DOCTYPE html>
<html dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta http-equiv="X-UA-Compatibility" content="IE=Edge">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Pufferfin">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">

    <meta id="themeColor" name="theme-color" content="#202020">

    <!-- PUFFERFIN: Pufferfin icons; 16 and 32 px are a simplified drawing, the full logo is mush at that size -->
    <link rel="apple-touch-icon" sizes="180x180" href="apps/pufferfin/assets/favicons/touchicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="apps/pufferfin/assets/favicons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="apps/pufferfin/assets/favicons/favicon-16.png">
    <link rel="shortcut icon" href="apps/pufferfin/assets/favicons/favicon.ico">
    <meta name="msapplication-TileImage" content="apps/pufferfin/assets/favicons/touchicon144.png">
    <meta name="msapplication-TileColor" content="#000000">

    <title>Pufferfin</title>

    <style>
        .transparentDocument,
        .backgroundContainer-transparent:not(.withBackdrop) {
            background: none !important;
            background-color: transparent !important;
        }

        .layout-tv .mouseIdle,
        .layout-tv .mouseIdle button,
        .layout-tv .mouseIdle select,
        .layout-tv .mouseIdle input,
        .layout-tv .mouseIdle textarea,
        .layout-tv .mouseIdle a,
        .layout-tv .mouseIdle label,
        .transparentDocument .mouseIdle,
        .transparentDocument .mouseIdle button,
        .transparentDocument .mouseIdle select,
        .transparentDocument .mouseIdle input,
        .transparentDocument .mouseIdle textarea,
        .transparentDocument .mouseIdle a,
        .transparentDocument .mouseIdle label,
        .screensaver-noScroll.mouseIdle,
        .screensaver-noScroll.mouseIdle button,
        .screensaver-noScroll.mouseIdle select,
        .screensaver-noScroll.mouseIdle input,
        .screensaver-noScroll.mouseIdle textarea,
        .screensaver-noScroll.mouseIdle a,
        .screensaver-noScroll.mouseIdle label {
            cursor: none !important;
        }

        html {
            background-color: #000; /* PUFFERFIN: black, like the rest of Pufferfin */
            color: rgba(255, 255, 255, 0.7);
        }

        .hide,
        .layout-desktop .hide-desktop,
        .layout-mobile .hide-mobile,
        .layout-tv .hide-tv,
        .mouseIdle .hide-mouse-idle,
        .mouseIdle-tv .hide-mouse-idle-tv {
            display: none !important;
        }

        .mainDrawerHandle {
            position: fixed;
            top: 0;
            bottom: 0;
            z-index: 1;
            width: 0.8em;
            padding-left: env(safe-area-inset-left);
            caret-color: transparent;
        }

        [dir="ltr"] .mainDrawerHandle {
            left: 0;
        }

        [dir="rtl"] .mainDrawerHandle {
            left: 0;
        }

        /* PUFFERFIN: the loading arc of the splash, before the stylesheets arrive */
        .splashLogo {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 1.75rem;
            height: 1.75rem;
            margin: -0.875rem 0 0 -0.875rem;
            color: rgba(245, 242, 236, 0.68);
        }

        .splashLogo svg {
            display: block;
            width: 100%;
            height: 100%;
            animation: splash-spin 0.8s linear infinite;
        }

        @keyframes splash-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body dir="ltr">
    <div id="reactRoot">
        <!-- PUFFERFIN: a small turning arc while the app loads, drawn inline so it shows before the bundles -->
        <div class="splashLogo" role="status" aria-label="Loading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        </div>
    </div>
</body>
</html>
