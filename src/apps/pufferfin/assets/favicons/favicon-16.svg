<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Simplified Pufferfin logo for 16 px: 8 spikes on the pixel grid, a single dot
       for the eye and no smile. -->
  <rect width="16" height="16" rx="3" fill="#000"/>
  <g transform="translate(8 8)">
    <g stroke="#fff" stroke-width="1.5" stroke-linecap="round">
      <line y1="-4.5" y2="-7" transform="rotate(0)"/>
      <line y1="-4.5" y2="-6.5" transform="rotate(45)"/>
      <line y1="-4.5" y2="-7" transform="rotate(90)"/>
      <line y1="-4.5" y2="-6.5" transform="rotate(135)"/>
      <line y1="-4.5" y2="-7" transform="rotate(180)"/>
      <line y1="-4.5" y2="-6.5" transform="rotate(225)"/>
      <line y1="-4.5" y2="-7" transform="rotate(270)"/>
      <line y1="-4.5" y2="-6.5" transform="rotate(315)"/>
    </g>
    <circle r="5" fill="#fff"/>
    <circle cy="-0.5" r="2" fill="#000"/>
  </g>
</svg>
