<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Simplified Pufferfin logo for 32 px: 12 spikes instead of 24, thicker strokes,
       a ring eye and a short smile. The full drawing turns to grey mush at this size. -->
  <rect width="32" height="32" rx="7" fill="#000"/>
  <g transform="translate(16 16)">
    <g stroke="#fff" stroke-width="2.4" stroke-linecap="round">
      <line y1="-9" y2="-14" transform="rotate(0)"/>
      <line y1="-9" y2="-12.5" transform="rotate(30)"/>
      <line y1="-9" y2="-14" transform="rotate(60)"/>
      <line y1="-9" y2="-12.5" transform="rotate(90)"/>
      <line y1="-9" y2="-14" transform="rotate(120)"/>
      <line y1="-9" y2="-12.5" transform="rotate(150)"/>
      <line y1="-9" y2="-14" transform="rotate(180)"/>
      <line y1="-9" y2="-12.5" transform="rotate(210)"/>
      <line y1="-9" y2="-14" transform="rotate(240)"/>
      <line y1="-9" y2="-12.5" transform="rotate(270)"/>
      <line y1="-9" y2="-14" transform="rotate(300)"/>
      <line y1="-9" y2="-12.5" transform="rotate(330)"/>
    </g>
    <circle r="9.5" fill="#fff"/>
    <circle cy="-1.5" r="4" fill="#000"/>
    <circle cx="0.6" cy="-2.2" r="1.5" fill="#fff"/>
    <path d="M -3 5.2 Q 0 7 3 5.2" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
